<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LearnLux · Your Tax Advisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#082732;
    --ink-soft:rgba(8,39,50,.72);
    --paper:#F7F2E8;
    --panel:#FFFFFF;
    --line:rgba(8,39,50,.14);
    --teal:#29A59A;
    --teal-soft:#E3F3F1;
    --amber:#F4B22D;
    --amber-soft:#FDF1DA;
    --muted:rgba(8,39,50,.56);
    --shadow: 0 1px 2px rgba(8,39,50,.08);
    --radius: 3px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F7F2E8;
      --ink-soft:rgba(247,242,232,.76);
      --paper:#041419;
      --panel:#082732;
      --line:rgba(247,242,232,.14);
      --teal:#7FC9C2;
      --teal-soft:#12302E;
      --amber:#FAD896;
      --amber-soft:#332813;
      --muted:rgba(247,242,232,.56);
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --ink:#F7F2E8; --ink-soft:rgba(247,242,232,.76); --paper:#041419; --panel:#082732; --line:rgba(247,242,232,.14);
    --teal:#7FC9C2; --teal-soft:#12302E; --amber:#FAD896; --amber-soft:#332813; --muted:rgba(247,242,232,.56);
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{ font-family:'Newsreader', ui-serif, Georgia, serif; font-weight:500; letter-spacing:-0.01em; }

  .app{ max-width:760px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

  header.topbar{
    padding:22px 28px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand-block .eyebrow{ font-size:12.5px; color:var(--muted); margin:0 0 4px; }
  .brand-block h1{ font-size:24px; margin:0; color:var(--ink); }

  .detail{ flex:1; padding:34px 24px 60px; }

  .state-message{ max-width:420px; margin:60px auto; text-align:center; color:var(--muted); font-size:14px; }

  .firm-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; padding-bottom:20px; border-bottom:1px solid var(--line); margin-bottom:26px; }
  .firm-head h2{ font-size:28px; margin:0 0 6px; }
  .firm-meta{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--muted); align-items:center; }
  .firm-meta .flag{ font-size:15px; }

  .quickfacts{ border:1px solid var(--line); border-radius:var(--radius); margin-bottom:30px; overflow:hidden; }
  .qf-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); }
  .qf{ padding:13px 16px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  .qf:last-child{ border-right:none; }
  .qf-full{ padding:13px 16px; border-top:1px solid var(--line); }
  .qf-grid:empty + .qf-full{ border-top:none; }
  .qf .label, .qf-full .label{ font-size:11px; color:var(--muted); margin-bottom:4px; }
  .qf .value, .qf-full .value{ font-size:13.5px; color:var(--ink); }

  section.block{ margin-bottom:30px; }
  section.block h3{ font-size:14px; font-weight:600; font-family:'IBM Plex Sans', sans-serif; color:var(--teal); margin:0 0 10px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  section.block p{ margin:0 0 10px; color:var(--ink-soft); max-width:70ch; }
  .tag-row{ display:flex; flex-wrap:wrap; gap:7px; }
  .tag{ font-size:12.5px; padding:4px 10px; border-radius:20px; background:var(--teal-soft); color:var(--teal); }

  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:26px; }
  @media (max-width: 620px){ .two-col{ grid-template-columns:1fr; } }

  .website-link{ font-size:13px; color:var(--teal); text-decoration:none; border-bottom:1px solid var(--teal); }

  .pricing-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
  .pricing-item .pricing-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:13.5px; color:var(--ink); font-weight:600; }
  .pricing-item .pricing-fee{ color:var(--teal); font-weight:600; white-space:nowrap; font-size:13px; }
  .pricing-item .pricing-desc{ margin:4px 0 0; font-size:12.5px; color:var(--muted); }

  .credentials-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .credentials-list li{ font-size:13.5px; color:var(--ink-soft); padding-left:14px; position:relative; }
  .credentials-list li::before{ content:"–"; position:absolute; left:0; color:var(--teal); }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:10px; }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand-block">
      <p class="eyebrow">LearnLux</p>
      <h1>Your tax advisor</h1>
    </div>
  </header>

  <main class="detail" id="detail">
    <p class="state-message">Loading…</p>
  </main>
</div>

<script>
function hasValue(v){
  if(!v) return false;
  const t = v.trim();
  return t !== '' && t.toLowerCase() !== 'not specified';
}

const detailEl = document.getElementById('detail');
let currentFirm = null;

function extractFirmId(){
  // Expects /firm/<airtableId>
  const m = location.pathname.match(/\/firm\/([^\/]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}

function showState(message){
  detailEl.innerHTML = `<p class="state-message">${message}</p>`;
}

async function loadFirm(){
  const id = extractFirmId();
  if(!id){
    showState("This page needs a specific advisor link. Please check the link you were sent.");
    return;
  }
  try{
    const res = await fetch('/api/firm/' + encodeURIComponent(id));
    if(!res.ok){
      showState("This link isn't valid, or the profile is no longer available. Please check the link you were sent, or contact your LearnLux planner.");
      return;
    }
    currentFirm = await res.json();
    renderDetail();
  } catch(e){
    showState("Something went wrong loading this profile. Please try again in a moment.");
  }
}

function renderDetail(){
  const f = currentFirm;
  if(!f) return;

  const shortFacts = [];
  if(hasValue(f.years)) shortFacts.push(['Years of experience', f.years]);
  if(hasValue(f.responseTime)) shortFacts.push(['Time to schedule a meeting', f.responseTime]);
  if(hasValue(f.languages)) shortFacts.push(['Languages', f.languages]);
  if(hasValue(f.consultFee)) shortFacts.push(['Typical consultation', f.consultFee]);
  const membershipValue = hasValue(f.membership) ? f.membership.replace(/\.\s*$/, '') : null;

  const quickfactsHTML = (shortFacts.length || membershipValue) ? `
    <div class="quickfacts">
      <div class="qf-grid">${shortFacts.map(([label,value])=>`<div class="qf"><div class="label">${label}</div><div class="value">${value}</div></div>`).join('')}</div>
      ${membershipValue ? `<div class="qf-full"><div class="label">Professional membership</div><div class="value">${membershipValue}</div></div>` : ''}
    </div>` : '';

  const aboutHTML = hasValue(f.about) ? `
    <section class="block">
      <h3>About the firm</h3>
      <p>${f.about}</p>
    </section>` : '';

  const bestFitHTML = hasValue(f.idealClient) ? `
    <section class="block">
      <h3>Best fit for</h3>
      <p>${f.idealClient}</p>
    </section>` : '';

  const servicesHTML = (f.services && f.services.length) ? `
    <section class="block">
      <h3>What they help with</h3>
      <div class="tag-row">${f.services.map(s=>`<span class="tag">${s}</span>`).join('')}</div>
    </section>` : '';

  const consultProcessP = hasValue(f.consultProcess) ? `<p>${f.consultProcess}</p>` : '';
  const pricingNoteP = hasValue(f.pricingNote) ? `<p>${f.pricingNote}</p>` : '';
  const pricingItemsHTML = (f.pricingItems && f.pricingItems.length) ? `
    <ul class="pricing-list">${f.pricingItems.map(item => `
      <li class="pricing-item">
        <div class="pricing-head"><span>${item.name}</span><span class="pricing-fee">${item.fee}</span></div>
        ${item.description ? `<p class="pricing-desc">${item.description}</p>` : ''}
      </li>`).join('')}</ul>` : '';
  const hasConsultSection = hasValue(f.consultProcess) || hasValue(f.pricingNote) || pricingItemsHTML;
  const hasBringSection = hasValue(f.whatToBring);

  const consultSection = hasConsultSection ? `<section class="block"><h3>Consultation & fees</h3>${consultProcessP}${pricingItemsHTML || pricingNoteP}</section>` : '';
  const bringSection = hasBringSection ? `<section class="block"><h3>Good to bring to the first call</h3><p>${f.whatToBring}</p></section>` : '';

  let twoColHTML = '';
  if(hasConsultSection && hasBringSection){
    twoColHTML = `<div class="two-col">${consultSection}${bringSection}</div>`;
  } else {
    twoColHTML = consultSection + bringSection;
  }

  const credentialsListHTML = (f.credentialsList && f.credentialsList.length)
    ? `<ul class="credentials-list">${f.credentialsList.map(c => `<li>${c}</li>`).join('')}</ul>`
    : '';
  const credentialsHTML = (credentialsListHTML || hasValue(f.credentials)) ? `
    <section class="block">
      <h3>Credentials</h3>
      ${credentialsListHTML || `<p>${f.credentials}</p>`}
    </section>` : '';

  const websiteHTML = hasValue(f.website) ? `<p style="margin-top:6px;"><a class="website-link" href="${f.website}" target="_blank" rel="noopener">Visit firm website ↗</a></p>` : '';
  const privacyHTML = hasValue(f.privacyPolicy) ? `<p style="margin-top:6px;"><a class="website-link" href="${f.privacyPolicy}" target="_blank" rel="noopener">Privacy policy ↗</a></p>` : '';

  detailEl.innerHTML = `
    <div class="firm-head">
      <div>
        <h2>${f.name}</h2>
        <div class="firm-meta">
          <span class="flag">${f.flag}</span><span>${f.city}, ${f.country}${f.locationSuffix ? ' ' + f.locationSuffix : ''}</span>
        </div>
      </div>
    </div>

    ${quickfactsHTML}
    ${aboutHTML}
    ${bestFitHTML}
    ${servicesHTML}
    ${twoColHTML}
    ${credentialsHTML}
    ${websiteHTML}
    ${privacyHTML}
  `;
}

loadFirm();
</script>
</body>
</html>
