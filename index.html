<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Equity Tax Advisory Network — Partner Firms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --ink:#082732;

    --panel:#FFFFFF;
    --line:rgba(8,39,50,.14);
    --teal:#29A59A;
    --teal-soft:#E3F3F1;
    --amber:#F4B22D;
    --amber-soft:#FDF1DA;
    --muted:rgba(8,39,50,.56);
    --shadow: 0 1px 2px rgba(8,39,50,.08);
    --radius: 3px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F7F2E8;
      --ink-soft:rgba(247,242,232,.76);
      --paper:#041419;
      --panel:#082732;
      --line:rgba(247,242,232,.14);
      --teal:#7FC9C2;
      --teal-soft:#12302E;
      --amber:#FAD896;
      --amber-soft:#332813;
      --muted:rgba(247,242,232,.56);
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --ink:#F7F2E8; --ink-soft:rgba(247,242,232,.76); --paper:#041419; --panel:#082732; --line:rgba(247,242,232,.14);
    --teal:#7FC9C2; --teal-soft:#12302E; --amber:#FAD896; --amber-soft:#332813; --muted:rgba(247,242,232,.56);

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);

  h1,h2,h3,.serif{ font-family:'Newsreader', ui-serif, Georgia, serif; font-weight:500; letter-spacing:-0.01em; }

  header.topbar{
    padding:22px 28px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }

  .brand-block h1{ font-size:26px; margin:0; color:var(--ink); }
  .topbar-right{ display:flex; align-items:center; gap:14px; }
  .view-toggle{ display:flex; border:1px solid var(--line); border-radius:20px; overflow:hidden; font-size:12.5px; }
  .view-toggle button{ background:transparent; border:none; padding:6px 14px; cursor:pointer; color:var(--muted); font-family:inherit; }
  .view-toggle button.active{ background:var(--teal); color:#fff; }

  .body-grid{ flex:1; display:grid; grid-template-columns:320px 1fr; min-height:0; }

  /* Solo mode: reached via an emailed firm-specific link. Shows only that one
     firm's profile — no sidebar, no directory, no way to browse other firms. */
  .app.solo .sidebar{ display:none !important; }
  .app.solo .body-grid{ grid-template-columns:1fr; }
  .app.solo .topbar-right{ display:none !important; }
  .app.solo .back-btn{ display:none !important; }
  .app.solo .detail{ max-width:760px; margin:0 auto; }

  .sidebar{ border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .search-wrap{ padding:16px 18px 10px; }
  .search-wrap input{
    width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--panel); color:var(--ink); font-family:inherit; font-size:13.5px;
  }
  .search-wrap input:focus{ outline:2px solid var(--teal); outline-offset:1px; }
  .firm-count{ padding:0 18px 10px; font-size:12px; color:var(--muted); }
  .country-groups{ overflow-y:auto; flex:1; padding-bottom:20px; }
  .country-group{ border-top:1px solid var(--line); }
  .country-header{
    width:100%; display:flex; align-items:center; justify-content:space-between; background:none;
    border:none; text-align:left; padding:11px 18px; cursor:pointer; font-family:inherit; color:var(--ink);
  }
  .country-header .name{ display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:500; }
  .country-header .count{ font-size:12px; color:var(--muted); }
  .country-header .chev{ transition:transform .15s ease; color:var(--muted); font-size:11px; }
  .country-group.collapsed .chev{ transform:rotate(-90deg); }
  .country-group.collapsed .firm-list{ display:none; }

  .firm-list{ padding:0 0 6px; }
  .firm-item{
    width:100%; display:block; text-align:left; background:none; border:none; padding:8px 18px 8px 40px;
    cursor:pointer; font-family:inherit; color:var(--ink-soft); font-size:13.5px; border-left:2px solid transparent;
  }
  .firm-item:hover{ background:var(--teal-soft); }
  .firm-item.selected{ background:var(--teal-soft); border-left:2px solid var(--teal); color:var(--ink); font-weight:500; }
  .firm-item .status-dot{ display:inline-block; width:6px;height:6px; border-radius:50%; margin-right:7px; background:var(--amber); position:relative; top:-1px; }
  .firm-item .status-dot.mou{ background:var(--teal); }

  .detail{ overflow-y:auto; padding:34px 44px 60px; }
  .empty-state{ height:100%; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; text-align:center; padding:40px; }

  .firm-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; padding-bottom:20px; border-bottom:1px solid var(--line); margin-bottom:26px; }
  .firm-head h2{ font-size:30px; margin:0 0 6px; }
  .firm-meta{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--muted); align-items:center; }
  .firm-meta .flag{ font-size:15px; }
  .internal-badge{ font-size:11.5px; padding:3px 9px; border-radius:20px; background:var(--amber-soft); color:var(--amber); white-space:nowrap; border:1px solid var(--amber); }
  .internal-badge.mou{ background:var(--teal-soft); color:var(--teal); border-color:var(--teal); }

  .quickfacts{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:30px; overflow:hidden; }
  .qf{ padding:13px 16px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  .qf:last-child{ border-right:none; }
  .qf .label{ font-size:11px; color:var(--muted); margin-bottom:4px; }
  .qf .value{ font-size:13.5px; color:var(--ink); }

  section.block{ margin-bottom:30px; }
  section.block h3{ font-size:14px; font-weight:600; font-family:'IBM Plex Sans', sans-serif; color:var(--teal); margin:0 0 10px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  section.block p{ margin:0 0 10px; color:var(--ink-soft); max-width:70ch; }
  .tag-row{ display:flex; flex-wrap:wrap; gap:7px; }
  .tag{ font-size:12.5px; padding:4px 10px; border-radius:20px; background:var(--teal-soft); color:var(--teal); }

  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:26px; }
  @media (max-width: 720px){ .two-col{ grid-template-columns:1fr; } }

  .website-link{ font-size:13px; color:var(--teal); text-decoration:none; border-bottom:1px solid var(--teal); }

  @media (max-width: 860px){
    .body-grid{ grid-template-columns:1fr; }
    .sidebar{ border-right:none; border-bottom:1px solid var(--line); max-height:none; }
    .app.showing-detail .sidebar{ display:none; }
    .app:not(.showing-detail) .detail{ display:none; }
    .detail{ padding:22px 18px 60px; }
  }
  .back-btn{ display:none; }
  @media (max-width: 860px){
    .back-btn{ display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--teal); font-family:inherit; font-size:13.5px; padding:0 0 16px; cursor:pointer; }
  }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:10px; }
</style>
</head>

// ---------- helpers ----------
function normalize(s){
  return (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}

// ---------- render ----------
const app = document.getElementById('app');
const groupsEl = document.getElementById('countryGroups');
const detailEl = document.getElementById('detail');
const countEl = document.getElementById('firmCount');
const searchInput = document.getElementById('searchInput');

let currentView = 'member';
let currentFirmId = null;
let collapsedCountries = new Set();

function groupByCountry(firms){
  const map = {};
  firms.forEach(f=>{
    if(!map[f.country]) map[f.country] = [];
    map[f.country].push(f);
  });
  return Object.keys(map).sort().map(c => ({ country:c, flag:map[c][0].flag, firms: map[c].sort((a,b)=>a.name.localeCompare(b.name)) }));
}

function renderSidebar(){
  const q = searchInput.value.trim().toLowerCase();
  const filtered = FIRMS.filter(f =>
    f.name.toLowerCase().includes(q) || f.country.toLowerCase().includes(q)
  );
  countEl.textContent = `${filtered.length} partner firm${filtered.length===1?'':'s'} across ${new Set(filtered.map(f=>f.country)).size} countries`;

  const groups = groupByCountry(filtered);
  groupsEl.innerHTML = '';
  groups.forEach(g=>{
    const wrap = document.createElement('div');
    wrap.className = 'country-group' + (collapsedCountries.has(g.country) ? ' collapsed' : '');

    const header = document.createElement('button');
    header.className = 'country-header';
    header.innerHTML = `<span class="name">${g.flag} ${g.country}</span><span class="count">${g.firms.length} · <span class="chev">▾</span></span>`;
    header.onclick = () => {
      if(collapsedCountries.has(g.country)) collapsedCountries.delete(g.country);
      else collapsedCountries.add(g.country);
      renderSidebar();
    };
    wrap.appendChild(header);

    const list = document.createElement('div');
    list.className = 'firm-list';
    g.firms.forEach(f=>{
      const item = document.createElement('button');
      item.className = 'firm-item' + (f.id===currentFirmId ? ' selected' : '');
      const dotClass = f.status === 'Need MoU' ? 'mou' : '';
      item.innerHTML = `<span class="status-dot ${dotClass}"></span>${f.name}`;
      item.onclick = () => selectFirm(f.id, true);
      list.appendChild(item);
    });
    wrap.appendChild(list);
    groupsEl.appendChild(wrap);
  });
}

function selectFirm(id, updateHash){
  currentFirmId = id;
  app.classList.add('showing-detail');
  renderSidebar();
  renderDetail();
  detailEl.scrollTop = 0;
  if(updateHash){
    const f = FIRMS.find(x=>x.id===id);
    if(f) history.replaceState(null, '', '#firm=' + f.airtableId);
  }
}

function renderDetail(){
  const f = FIRMS.find(x=>x.id===currentFirmId);
  if(!f){
    detailEl.innerHTML = '<div class="empty-state">Select a firm on the left to view its profile.</div>';
    return;
  }
  const isInternal = currentView === 'internal';
  const badge = isInternal
    ? `<span class="internal-badge ${f.status==='Need MoU'?'mou':''}">${f.status}</span>`
    : '';

  detailEl.innerHTML = `
    <button class="back-btn" id="backBtn">‹ Back to firms</button>
    <div class="firm-head">
      <div>
        <h2>${f.name}</h2>
        <div class="firm-meta">
          <span class="flag">${f.flag}</span><span>${f.city}, ${f.country}</span>
        </div>
      </div>
      ${badge}
    </div>

    <div class="quickfacts">
      <div class="qf"><div class="label">Years of experience</div><div class="value">${f.years}</div></div>
      <div class="qf"><div class="label">Time to schedule a meeting</div><div class="value">${f.responseTime}</div></div>
      <div class="qf"><div class="label">Languages</div><div class="value">${f.languages}</div></div>
      <div class="qf"><div class="label">Typical consultation</div><div class="value">${f.consultFee}</div></div>
      <div class="qf"><div class="label">Professional membership</div><div class="value">${f.membership.replace(/\.\s*$/, '')}</div></div>
    </div>

    <section class="block">
      <h3>About the firm</h3>
      <p>${f.about}</p>
    </section>

    <section class="block">
      <h3>Best fit for</h3>
      <p>${f.idealClient}</p>
    </section>

    <section class="block">
      <h3>What they help with</h3>
      <div class="tag-row">${f.services.map(s=>`<span class="tag">${s}</span>`).join('')}</div>
    </section>

    <div class="two-col">
      <section class="block">
        <h3>Consultation & fees</h3>
        <p>${f.consultProcess}</p>
        <p style="color:var(--muted); font-size:13px;">${f.pricingNote}</p>
      </section>
      <section class="block">
        <h3>Good to bring to the first call</h3>
        <p>${f.whatToBring}</p>
      </section>
    </div>

    <section class="block">
      <h3>Credentials</h3>
      <p>${f.credentials}</p>
    </section>

    <p style="margin-top:6px;"><a class="website-link" href="${f.website}" target="_blank" rel="noopener">Visit firm website ↗</a></p>
  `;

  const back = document.getElementById('backBtn');
  if(back) back.onclick = () => { app.classList.remove('showing-detail'); };
}

document.getElementById('viewToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-view]');
  if(!btn) return;
  currentView = btn.dataset.view;
  document.querySelectorAll('.view-toggle button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderDetail();
});

searchInput.addEventListener('input', renderSidebar);

// Deep-link support: a URL ending in #firm=<name> auto-opens that firm's profile.
// Matching is normalized (case/spaces/punctuation-insensitive) so it works whether
// the name in the link is exactly encoded or not.
function tryOpenFromHash(){
  const m = location.hash.match(/#firm=(.+)/);
  if(!m) return false;
  let raw = m[1];
  try{ raw = decodeURIComponent(raw); }catch(e){}
  // Prefer an exact Airtable record ID match (e.g. #firm=recABC123...) — this is what
  // the consent email links to, and it's immune to spaces/punctuation breaking the link.
  let match = FIRMS.find(f => f.airtableId === raw.trim());
  // Fall back to a normalized firm-name match for manually built links.
  if(!match){
    const target = normalize(raw);
    match = FIRMS.find(f => normalize(f.name) === target);
  }
  if(match){
    selectFirm(match.id, false);
    return true;
  }
  return false;
}

function enterSoloMode(firm){
  app.classList.add('solo');
  document.getElementById('brandEyebrow').textContent = 'LearnLux';
  document.getElementById('brandTitle').textContent = 'Your tax advisor';
  currentView = 'member'; // members never see internal status in solo mode
}

renderSidebar();
const openedFromLink = tryOpenFromHash();
if(openedFromLink){
  const f = FIRMS.find(x=>x.id===currentFirmId);
  if(f) enterSoloMode(f);
} else {
  renderDetail();
}
// Deliberately no hashchange listener in solo mode — once locked to a single firm,
// the page should not respond to a hash edited by hand to reveal another firm.
if(!openedFromLink){
  window.addEventListener('hashchange', tryOpenFromHash);
}

</script>
